function randomMissionPositions(level,index){
 const nodes=[];
 for(let r=0;r<level.rows;r++)for(let c=0;c<level.cols;c++)nodes.push({c,r,id:r*level.cols+c});
 const last=lastMissionPositions[index];
 const minSteps=(level.cols+level.rows>=7)?3:2;
 const options=[];
 for(const a of nodes)for(const b of nodes){
  const dx=Math.abs(a.c-b.c),dy=Math.abs(a.r-b.r);
  if(dx===0||dy===0||dx+dy<minSteps)continue; // selalu ada belokan, bukan garis lurus
  const viaCandidates=level.via?nodes.filter(v=>v.id!==a.id&&v.id!==b.id&&
    Math.abs(v.c-a.c)+Math.abs(v.r-a.r)>=2&&
    Math.abs(v.c-b.c)+Math.abs(v.r-b.r)>=2):[];
  if(level.via&&!viaCandidates.length)continue;
  let weight=1;
  // Variasikan posisi tengah/tepi kota dan misi arah utara/selatan/timur/barat.
  if(a.c>0&&a.c<level.cols-1)weight+=.5;
  if(a.r>0&&a.r<level.rows-1)weight+=.5;
  if(b.c>0&&b.c<level.cols-1)weight+=.5;
  if(b.r>0&&b.r<level.rows-1)weight+=.5;
  const recent=last&&(a.id===last.start||b.id===last.goal||
    (a.id===last.goal&&b.id===last.start));
  if(recent)weight=.0001;
  options.push({a,b,viaCandidates,weight});
 }
 let pool=options.filter(p=>p.weight>.01);
 if(!pool.length)pool=options;
 let total=pool.reduce((z,p)=>z+p.weight,0),pick=Math.random()*total;
 let chosen=pool[pool.length-1];
 for(const o of pool){pick-=o.weight;if(pick<=0){chosen=o;break}}
 let via=null;
 if(level.via){
  let choices=chosen.viaCandidates.filter(v=>!last||v.id!==last.via);
  if(!choices.length)choices=chosen.viaCandidates;
  via=choices[Math.floor(Math.random()*choices.length)];
 }
 lastMissionPositions[index]={start:chosen.a.id,goal:chosen.b.id,via:via?.id??null};
 try {localStorage.setItem('sre-last-mission-locations',JSON.stringify(lastMissionPositions))} catch(e) {}
 return {...level,start:[chosen.a.c,chosen.a.r],goal:[chosen.b.c,chosen.b.r],
  ...(level.via?{via:[via.c,via.r]}:{})};
}

 drawLandmarkLabels(){

   let roof=this.P(land.x,land.y,height+(land.kind==='school'?15:land.kind==='home'?17:8));

   }else y=Math.max(this.height<390?48:72,y);
