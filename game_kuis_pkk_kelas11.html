<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PKK Quest Kelas XI</title><style>:root{font-family:system-ui,Arial;background:#10162d;color:white}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#303a79,#10162d 55%)}main{max-width:740px;margin:auto;padding:22px 16px 60px}.panel{background:#20294c;border:1px solid #59618a;border-radius:24px;padding:25px;box-shadow:0 16px 40px #0005}.logo{font-size:48px;text-align:center}.muted{color:#c6cce8}.center{text-align:center}h1{font-size:clamp(30px,7vw,52px);margin:10px 0;color:#ffe59d}h2{font-size:clamp(22px,5vw,30px)}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:15px;padding:14px 18px;font-weight:750}button:disabled{cursor:default;opacity:.8}.primary{background:#ffd166;color:#222644;width:100%;margin-top:18px}.secondary{background:#39436e;color:white}.choice{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#303b65;color:white;border:2px solid #53618e;margin:12px 0;transition:.15s}.choice:not(:disabled):active{transform:scale(.98)}.choice b{display:grid;place-items:center;background:#5465a1;min-width:38px;height:38px;border-radius:11px}.choice.good{background:#176d58;border-color:#65e6ae}.choice.bad{background:#82394b;border-color:#ff8e9b}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{background:#34406b;border-radius:99px;padding:9px 13px;font-weight:700}.progress{height:12px;background:#3a446b;border-radius:30px;overflow:hidden;margin:18px 0 25px}.bar{height:100%;background:linear-gradient(90deg,#70e5bb,#ffd166);transition:width .3s}.feedback{padding:14px 17px;border-radius:14px;background:#34416a;margin-top:15px;line-height:1.5}.hidden{display:none}.small{font-size:13px}input{width:100%;padding:15px;border:2px solid #66739f;background:#111b3b;color:white;border-radius:12px;margin-top:10px}.result{font-size:66px;font-weight:900;color:#ffd166;margin:15px 0}.review{margin-top:14px;padding:12px;background:#303b65;border-radius:12px}footer{color:#aeb7da;text-align:center;margin-top:18px;font-size:13px}</style></head><body><main><section id="start" class="panel center"><div class="logo">🎮🏆</div><h1>PKK QUEST</h1><p class="muted">Game Kuis Produk Kreatif & Kewirausahaan • Kelas XI</p><p>15 tantangan • 100 poin per soal • Bonus streak 🔥</p><label for="nama">Nama pemain</label><input id="nama" maxlength="35" placeholder="Ketik nama siswa..." autocomplete="off"><button class="primary" onclick="startGame()">🚀 MULAI BERMAIN</button><p class="small muted">Bisa dimainkan di HP maupun komputer, tanpa internet setelah file dibuka.</p></section><section id="play" class="panel hidden"><div class="top"><span class="pill" id="level">Soal 1/15</span><span class="pill" id="score">⭐ 0 poin</span><span class="pill" id="streak">🔥 0</span></div><div class="progress"><div id="bar" class="bar" style="width:0%"></div></div><div class="muted" id="category"></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button id="next" class="primary hidden" onclick="nextQuestion()">SOAL BERIKUTNYA ➜</button></section><section id="finish" class="panel center hidden"><div class="logo" id="trophy">🏆</div><h1>GAME SELESAI!</h1><p id="player"></p><div class="result" id="finalScore"></div><p id="summary"></p><p id="record" class="muted"></p><button class="primary" onclick="restart()">🔄 MAIN LAGI</button><button class="secondary" style="width:100%;margin-top:10px" onclick="showReview()">📚 LIHAT PEMBAHASAN</button><div id="reviews" class="hidden" style="text-align:left"></div></section><footer>PKK Quest • Latihan belajar interaktif Kelas XI</footer></main><script>
const bank=[
['Karakter Wirausaha','Sikap apa yang penting ketika usaha mengalami kegagalan?',['Langsung menyerah','Pantang menyerah dan mengevaluasi','Menyalahkan pembeli','Berhenti mencoba'],1,'Wirausahawan belajar dari kegagalan dan memperbaiki strateginya.'],
['Peluang Usaha','Analisis SWOT digunakan untuk menilai ...',['Kekuatan, kelemahan, peluang, ancaman','Harga, modal, omzet, laba','Logo, merek, kemasan, iklan','Penjual, pembeli, kurir, toko'],0,'SWOT adalah Strengths, Weaknesses, Opportunities, Threats.'],
['HKI','Perlindungan untuk nama dan logo merek dagang termasuk ...',['Hak cipta','Paten','Merek','Rahasia dagang'],2,'Merek melindungi tanda pembeda barang atau jasa.'],
['Target Pasar','Kelompok konsumen yang menjadi sasaran utama penjualan disebut ...',['Pemasok','Target pasar','Distributor','Pesaing'],1,'Target pasar adalah kelompok konsumen yang ingin dijangkau produk.'],
['Survei Konsumen','Cara paling tepat mengetahui minuman favorit siswa adalah ...',['Menebak sendiri','Mengikuti selera pemilik','Menyurvei calon pembeli','Meniru harga pesaing'],2,'Survei membantu memahami kebutuhan dan minat calon pembeli.'],
['Budgeting','Apa arti budgeting dalam usaha?',['Rencana penggunaan uang','Daftar pelanggan','Teknik membuat logo','Cara mengirim barang'],0,'Budgeting adalah perencanaan pemasukan dan pengeluaran usaha.'],
['Budgeting','Manakah contoh biaya tetap yang umum pada usaha?',['Bahan baku per cup','Sewa kios bulanan','Cup sekali pakai','Sedotan per pesanan'],1,'Sewa bulanan biasanya tidak berubah mengikuti jumlah cup yang dibuat.'],
['Biaya Produksi','Biaya bahan Rp45.000 dan kemasan Rp15.000. Total biayanya ...',['Rp30.000','Rp45.000','Rp60.000','Rp75.000'],2,'Rp45.000 + Rp15.000 = Rp60.000.'],
['HPP','Total biaya produksi Rp120.000 menghasilkan 30 cup. HPP per cup adalah ...',['Rp3.000','Rp4.000','Rp5.000','Rp6.000'],1,'HPP per cup = Rp120.000 ÷ 30 = Rp4.000.'],
['Harga Jual','Jika HPP Rp5.000 dan laba yang diinginkan Rp2.000 per unit, harga jualnya ...',['Rp3.000','Rp5.000','Rp7.000','Rp10.000'],2,'Harga jual = HPP + laba yang ditargetkan = Rp7.000.'],
['Omzet','Terjual 20 cup seharga Rp8.000 per cup. Omzetnya adalah ...',['Rp80.000','Rp120.000','Rp160.000','Rp200.000'],2,'Omzet = 20 × Rp8.000 = Rp160.000.'],
['Laba Rugi','Omzet Rp200.000 dan total biaya Rp150.000. Hasil usaha adalah ...',['Rugi Rp50.000','Laba Rp50.000','Laba Rp150.000','Rugi Rp200.000'],1,'Laba = Rp200.000 − Rp150.000 = Rp50.000.'],
['Laba Rugi','Omzet Rp90.000 dan total biaya Rp110.000. Usaha mengalami ...',['Laba Rp20.000','Laba Rp200.000','Rugi Rp20.000','Impas'],2,'Biaya melebihi omzet sebesar Rp20.000 sehingga rugi.'],
['Pemasaran','Dalam bauran pemasaran 4P, promotion berarti ...',['Lokasi','Harga','Produk','Promosi'],3,'4P mencakup Product, Price, Place, Promotion.'],
['Shopee','Setelah pesanan Shopee masuk dan siap diproses, penjual sebaiknya ...',['Mengabaikan pesanan','Mengemas dan mengirim sesuai instruksi pesanan','Menghapus produknya','Meminta pembayaran di luar aplikasi'],1,'Penjual perlu memproses, mengemas, dan menyerahkan paket sesuai alur pesanan di platform.']
];let questions=[],idx=0,points=0,streak=0,answers=[],name='';const $=id=>document.getElementById(id);function show(id){['start','play','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function startGame(){name=$('nama').value.trim()||'Pemain';questions=[...bank].sort(()=>Math.random()-.5);idx=0;points=0;streak=0;answers=[];show('play');render()}function render(){let q=questions[idx];$('level').textContent=`Soal ${idx+1}/${questions.length}`;$('score').textContent=`⭐ ${points} poin`;$('streak').textContent=`🔥 ${streak}`;$('bar').style.width=(idx/questions.length*100)+'%';$('category').textContent='📘 '+q[0];$('question').textContent=q[1];$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('next').textContent=idx===questions.length-1?'LIHAT HASIL 🏆':'SOAL BERIKUTNYA ➜';let opts=q[2].map((v,i)=>({v,i})).sort(()=>Math.random()-.5);$('choices').innerHTML='';opts.forEach(({v,i})=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<b>'+String.fromCharCode(65+i)+'</b><span></span>';b.querySelector('span').textContent=v;b.onclick=()=>choose(i);b.dataset.i=i;$('choices').appendChild(b)})}function choose(i){let q=questions[idx],ok=i===q[3];if(ok){streak++;points+=100+(streak>=3?20:0)}else streak=0;answers.push({q,selected:i,ok});[...$('choices').children].forEach(b=>{b.disabled=true;let n=+b.dataset.i;if(n===q[3])b.classList.add('good');else if(n===i)b.classList.add('bad')});$('score').textContent=`⭐ ${points} poin`;$('streak').textContent=`🔥 ${streak}`;$('feedback').textContent=(ok?'✅ Tepat! ':'❌ Belum tepat. ')+q[4];$('feedback').classList.remove('hidden');$('next').classList.remove('hidden')}function nextQuestion(){idx++;if(idx<questions.length)render();else finish()}function finish(){show('finish');$('bar').style.width='100%';let correct=answers.filter(a=>a.ok).length;$('player').textContent='Hebat, '+name+'!';$('finalScore').textContent=points+' ⭐';$('summary').textContent=`${correct} dari ${questions.length} jawaban benar • Akurasi ${Math.round(correct/questions.length*100)}%`;$('trophy').textContent=correct>=12?'🏆':correct>=8?'🥈':'💪';let best=0;try{best=Number(localStorage.getItem('pkkBest')||0);if(points>best){best=points;localStorage.setItem('pkkBest',String(best))}}catch(e){}$('record').textContent='Rekor tertinggi di perangkat ini: '+best+' poin';$('reviews').classList.add('hidden')}function showReview(){let box=$('reviews');box.innerHTML='';answers.forEach((a,i)=>{let div=document.createElement('div');div.className='review';div.textContent=`${i+1}. ${a.ok?'✅':'❌'} ${a.q[1]} | Jawaban: ${a.q[2][a.q[3]]}. ${a.q[4]}`;box.appendChild(div)});box.classList.toggle('hidden')}function restart(){show('start')}
</script></body></html>
