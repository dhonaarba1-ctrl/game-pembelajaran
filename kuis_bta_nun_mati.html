<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuis BTA - Hukum Nun Mati dan Tanwin</title><style>:root{font-family:Arial,sans-serif;color:#203b36;background:#f1f7f3}*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:720px;margin:auto}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 28px #234b3520;margin:16px 0}h1{font-size:26px;margin:0 0 8px;color:#176b54}h2{font-size:20px}p{line-height:1.55}.muted{color:#62746d}.pill{display:inline-block;background:#e2f4e9;color:#176b54;padding:6px 11px;border-radius:30px;font-size:13px}.bar{height:10px;background:#e6eee8;border-radius:30px;overflow:hidden;margin:14px 0}.bar div{height:100%;background:#2c9b77;transition:width .2s}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #cbded3;border-radius:12px;padding:14px;margin:10px 0;font-size:16px;color:#203b36;cursor:pointer}.option.selected{border:2px solid #178965;background:#e5f7ee}.btn{border:0;background:#168568;color:white;padding:13px 20px;border-radius:11px;font-size:15px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e7f2ed;color:#176b54}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.hide{display:none}.arab{font-family:'Times New Roman',serif;font-size:24px;direction:rtl}.review{border-bottom:1px solid #e2eae5;padding:12px 0}.good{color:#168568}.bad{color:#bf4b4b}input{width:100%;border:1px solid #bdd4c7;padding:13px;border-radius:10px;font-size:16px;margin:7px 0 16px}label{font-weight:bold}.score{font-size:56px;font-weight:bold;color:#168568;text-align:center}@media(max-width:480px){body{padding:10px}.card{padding:18px}h1{font-size:23px}}</style></head><body><main class="wrap"><header class="card"><span class="pill">BTA • Tajwid</span><h1>🎮 Kuis Hukum Nun Mati & Tanwin</h1><p class="muted">20 soal pilihan ganda • 5 poin setiap soal • Bisa dimainkan tanpa internet</p></header><section id="start" class="card"><h2>Siap bermain?</h2><p>Isi nama siswa, lalu tekan tombol mulai.</p><label for="student">Nama siswa</label><input id="student" placeholder="Masukkan nama siswa" maxlength="80"><button class="btn" id="begin">Mulai Kuis →</button></section><section id="game" class="card hide"><div style="display:flex;justify-content:space-between;gap:10px"><strong id="counter"></strong><span id="answered" class="muted"></span></div><div class="bar"><div id="progress"></div></div><h2 id="question"></h2><div id="options"></div><div class="actions"><button id="back" class="btn secondary">← Sebelumnya</button><button id="next" class="btn">Selanjutnya →</button></div></section><section id="result" class="card hide"><h2 style="text-align:center">🏆 Kuis Selesai!</h2><p id="who" style="text-align:center"></p><div class="score" id="score"></div><p id="message" style="text-align:center"></p><p id="correctCount" style="text-align:center" class="muted"></p><button class="btn" id="retry">Main Lagi</button><button class="btn secondary" onclick="window.print()">Cetak Hasil</button><h2>Pembahasan</h2><div id="reviews"></div></section></main><script>
const questions=[
['Ada berapa hukum utama nun mati dan tanwin?',['3','4','5','6'],2,'Ada lima hukum: Izhar Halqi, Idgham Bighunnah, Idgham Bilaghunnah, Iqlab, dan Ikhfa Hakiki.'],
['Nun mati ditandai dengan ...',['نْ','نَ','نُ','نِ'],0,'Nun mati adalah huruf nun yang bersukun.'],
['Hukum bacaan yang dibaca jelas disebut ...',['Ikhfa Hakiki','Izhar Halqi','Iqlab','Idgham Bighunnah'],1,'Izhar Halqi dibaca jelas.'],
['Jumlah huruf Izhar Halqi adalah ...',['4','5','6','7'],2,'Huruf Izhar Halqi: ء ه ع ح غ خ.'],
['Nun mati bertemu ء termasuk hukum ...',['Izhar Halqi','Iqlab','Ikhfa Hakiki','Idgham Bilaghunnah'],0,'Hamzah (ء) termasuk huruf Izhar Halqi.'],
['Nun mati bertemu ه dibaca ...',['Samar','Jelas','Diubah menjadi mim','Melebur tanpa dengung'],1,'Huruf ه termasuk huruf Izhar Halqi.'],
['Idgham Bighunnah dibaca dengan ...',['Jelas','Dengung','Pantulan','Tanpa dengung'],1,'Idgham Bighunnah berarti melebur dengan dengung.'],
['Huruf Idgham Bighunnah adalah ...',['ي ن م و','ل ر','ء ه ع ح','ب'],0,'Hurufnya ي ن م و.'],
['Nun mati bertemu ي pada dua kata termasuk ...',['Iqlab','Izhar Halqi','Idgham Bighunnah','Ikhfa Hakiki'],2,'Huruf ي termasuk Idgham Bighunnah ketika berada pada kata berikutnya.'],
['Idgham Bilaghunnah dibaca ...',['Dengan dengung','Tanpa dengung','Jelas','Samar'],1,'Idgham Bilaghunnah dibaca melebur tanpa dengung.'],
['Huruf Idgham Bilaghunnah adalah ...',['م و','ل ر','ب ف','ع ح'],1,'Hurufnya ل dan ر.'],
['Nun mati bertemu ر pada dua kata termasuk ...',['Idgham Bilaghunnah','Iqlab','Ikhfa Hakiki','Izhar Halqi'],0,'Ra adalah huruf Idgham Bilaghunnah.'],
['Huruf Iqlab adalah ...',['م','ن','ب','ل'],2,'Iqlab terjadi ketika nun mati atau tanwin bertemu ب.'],
['Pada hukum Iqlab, bunyi nun berubah menjadi ...',['Lam','Mim','Ra','Ya'],1,'Bunyi nun berubah menjadi mim yang disamarkan dengan dengung.'],
['Nun mati bertemu ب termasuk ...',['Izhar Halqi','Ikhfa Hakiki','Idgham Bighunnah','Iqlab'],3,'Ba merupakan satu-satunya huruf Iqlab.'],
['Ikhfa Hakiki dibaca ...',['Jelas','Samar disertai dengung','Tanpa dengung','Dipantulkan'],1,'Ikhfa Hakiki dibaca samar disertai dengung.'],
['Jumlah huruf Ikhfa Hakiki adalah ...',['10','12','15','16'],2,'Huruf Ikhfa Hakiki berjumlah 15.'],
['Nun mati bertemu ت termasuk ...',['Ikhfa Hakiki','Izhar Halqi','Iqlab','Idgham Bilaghunnah'],0,'Ta termasuk huruf Ikhfa Hakiki.'],
['Hukum tanwin pada عَلِيمٌ حَكِيمٌ adalah ...',['Ikhfa Hakiki','Izhar Halqi','Iqlab','Idgham Bighunnah'],1,'Tanwin bertemu ح sehingga hukumnya Izhar Halqi.'],
['Hukum nun mati pada مِنْ بَعْدِ adalah ...',['Idgham Bighunnah','Ikhfa Hakiki','Izhar Halqi','Iqlab'],3,'Nun mati bertemu ب sehingga hukumnya Iqlab.']
];
let index=0,answers=Array(questions.length).fill(null),name='';const $=id=>document.getElementById(id);function show(id){['start','game','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function render(){let q=questions[index];$('counter').textContent=`Soal ${index+1} dari ${questions.length}`;$('answered').textContent=`Terjawab ${answers.filter(x=>x!==null).length}/20`;$('progress').style.width=`${(index+1)/questions.length*100}%`;$('question').textContent=q[0];$('options').replaceChildren();q[1].forEach((o,i)=>{let b=document.createElement('button');b.className='option'+(answers[index]===i?' selected':'');b.textContent=`${'ABCD'[i]}. ${o}`;b.onclick=()=>{answers[index]=i;render()};$('options').append(b)});$('back').disabled=index===0;$('next').textContent=index===questions.length-1?'Selesai & Lihat Nilai':'Selanjutnya →'}$('begin').onclick=()=>{name=$('student').value.trim();if(!name){alert('Masukkan nama siswa terlebih dahulu.');$('student').focus();return}index=0;answers.fill(null);show('game');render()};$('back').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(answers[index]===null){alert('Pilih jawaban terlebih dahulu.');return}if(index<questions.length-1){index++;render()}else finish()};function finish(){show('result');let correct=answers.filter((a,i)=>a===questions[i][2]).length,score=correct*5;$('who').textContent=`Nama: ${name}`;$('score').textContent=`${score}/100`;$('correctCount').textContent=`${correct} jawaban benar dari 20 soal`;$('message').textContent=score>=80?'Hebat! Pemahaman tajwidmu sangat baik.':score>=60?'Bagus! Terus tingkatkan pemahaman tajwid.':'Tetap semangat! Pelajari pembahasan dan coba lagi.';$('reviews').replaceChildren();questions.forEach((q,i)=>{let div=document.createElement('div');div.className='review';let title=document.createElement('strong');title.textContent=`${i+1}. ${q[0]}`;let status=document.createElement('p');status.className=answers[i]===q[2]?'good':'bad';status.textContent=answers[i]===q[2]?'✓ Benar':`✕ Jawabanmu: ${answers[i]===null?'Tidak dijawab':q[1][answers[i]]}`;let detail=document.createElement('p');detail.textContent=`Jawaban benar: ${q[1][q[2]]}. ${q[3]}`;div.append(title,status,detail);$('reviews').append(div)})}$('retry').onclick=()=>{index=0;answers.fill(null);show('start')};
</script></body></html>
